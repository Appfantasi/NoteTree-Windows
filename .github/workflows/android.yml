
name: Build Note Tree Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - 'NoteTree.html'
      - 'package.json'
      - 'capacitor.config.json'
      - '.github/workflows/android.yml'

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Scarica il progetto
        uses: actions/checkout@v5

      - name: Installa Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Installa Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Prepara la pagina dell'app
        shell: bash
        run: |
          mkdir -p www
          cp NoteTree.html www/index.html

      - name: Installa le dipendenze
        run: npm install

      - name: Crea il progetto Android Capacitor
        run: npx cap add android

      - name: Sincronizza l'app Android
        run: npx cap sync android

      - name: Prepara la chiave di firma
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/notetree-release.jks"
          test -s "$RUNNER_TEMP/notetree-release.jks"

      - name: Compila APK release firmato
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          cd android
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file="$RUNNER_TEMP/notetree-release.jks" \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEYSTORE_PASSWORD"

      - name: Pubblica APK firmato
        uses: actions/upload-artifact@v6
        with:
          name: Note-Tree-Android-APK-Firmato
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
