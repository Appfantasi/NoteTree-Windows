
name: Build Note Tree Windows

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - 'NoteTree.html'
      - 'main.js'
      - 'preload.js'
      - 'package.json'
      - '.github/workflows/windows.yml'

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Scarica il progetto
        uses: actions/checkout@v5

      - name: Installa Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Installa le dipendenze
        run: npm install

      - name: Crea eseguibile portatile e installer
        run: npm run dist:win

      - name: Pubblica i file Windows
        uses: actions/upload-artifact@v6
        with:
          name: Note-Tree-Windows
          path: |
            dist/*.exe
          if-no-files-found: error
