
name: Note Tree Windows Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Scarica il progetto
        uses: actions/checkout@v5

      - name: Installa Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Installa le dipendenze
        run: npm install

      - name: Compila Note Tree per Windows
        run: npm run dist:win

      - name: Carica l'eseguibile
        uses: actions/upload-artifact@v6
        with:
          name: Note-Tree-Windows
          path: dist/*.exe
          if-no-files-found: error
