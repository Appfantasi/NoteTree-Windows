  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Note Tree">
  <title>Note Tree</title>

  <style>
    :root {
      color-scheme: light;
      --bg: #f6f8fb;
      --panel: #fff;
      --input: #fff;
      --text: #1f2430;
      --muted: #697386;
      --border: #e0e5ec;
      --accent: #4f7cff;
      --accent-soft: #eef2ff;
      --green: #17834a;
      --green-soft: #eaf7ee;
      --purple: #783fe0;
      --purple-soft: #f3eefe;
      --danger: #c0392b;
      --shadow: 0 8px 28px rgb(30 40 60 / 10%);
    }

    [data-theme="dark"] {
      color-scheme: dark;
      --bg: #10151b;
      --panel: #1a2028;
      --input: #111820;
      --text: #e6edf3;
      --muted: #9aa6b2;
      --border: #303a46;
      --accent: #70a4ff;
      --accent-soft: #202d42;
      --green: #48bd75;
      --green-soft: #1c3327;
      --purple: #b294ff;
      --purple-soft: #302440;
      --danger: #ff7168;
      --shadow: 0 8px 28px rgb(0 0 0 / 30%);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 20px;
      background: var(--bg);
      color: var(--text);
      font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
    }

    button, input, textarea, select { font: inherit; }
    button { color: inherit; }

    .app {
      width: min(100%, 820px);
      margin: 0 auto;
      padding: 22px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 14px;
      box-shadow: var(--shadow);
    }

    .heading, .toolbar, .modal-header, .modal-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    h1 { margin: 0; font-size: 21px; }
    h2 { margin: 0; font-size: 17px; }
    .hint { margin: 5px 0 18px; color: var(--muted); font-size: 13px; }

    button {
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--input);
      cursor: pointer;
    }

    button:hover { background: var(--accent-soft); }
    button:disabled { cursor: not-allowed; opacity: .55; }

    .theme-button {
      width: 40px;
      height: 40px;
      font-size: 18px;
    }

    .toolbar {
      flex-wrap: wrap;
      margin-bottom: 14px;
    }

    .count { color: var(--muted); font-size: 13px; }
    .toolbar-buttons, .add-actions { display: flex; flex-wrap: wrap; gap: 8px; }

    .toolbar-buttons button {
      padding: 7px 10px;
      color: var(--muted);
      font-size: 13px;
    }

    .search { margin-bottom: 14px; }

    input, textarea, select {
      width: 100%;
      padding: 10px 12px;
      color: var(--text);
      background: var(--input);
      border: 1px solid var(--border);
      border-radius: 8px;
      outline: none;
    }

    input:focus, textarea:focus, select:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-soft);
    }

    .add-actions { margin-bottom: 14px; }

    .add-button {
      flex: 1;
      min-width: 130px;
      padding: 11px;
      font-weight: 650;
    }

    .add-button[data-type="voce"] { color: var(--accent); }
    .add-button[data-type="url"] { color: var(--green); }
    .add-button[data-type="nota"] { color: var(--purple); }
    .add-button[data-type="cartella"] { color: var(--green); }
    .badge.folder { background: var(--accent-soft); color: var(--green); }

    .parent-row {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr);
      align-items: center;
      gap: 10px;
      margin-bottom: 18px;
      color: var(--muted);
      font-size: 13px;
    }

    .tree, .tree ul {
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .tree ul {
      margin-left: 15px;
      padding-left: 13px;
      border-left: 1px dashed var(--border);
    }

    .node { margin: 3px 0; }

    .node-row {
      display: flex;
      align-items: flex-start;
      gap: 7px;
      padding: 8px;
      border-radius: 8px;
    }

    .node-row:hover { background: var(--accent-soft); }

    .toggle {
      flex: 0 0 25px;
      width: 25px;
      height: 28px;
      padding: 0;
      border: 0;
      background: transparent;
      color: var(--muted);
    }

    .toggle.empty { visibility: hidden; }
    .collapsed > ul { display: none; }
    .collapsed > .node-row .toggle { transform: rotate(-90deg); }

    .node-content {
      flex: 1;
      min-width: 0;
      overflow-wrap: anywhere;
      padding: 3px 0;
    }

    .node-actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 3px;
    }

    .node-actions button {
      min-width: 32px;
      min-height: 32px;
      padding: 4px 7px;
      color: var(--muted);
    }

    .node-actions .edit:hover { color: var(--accent); }
    .node-actions .delete:hover { color: var(--danger); }
    .node-actions .read:hover { color: var(--green); }

    .badge {
      display: inline-block;
      margin-left: 6px;
      padding: 1px 7px;
      border-radius: 999px;
      font-size: 10px;
      font-weight: 650;
      vertical-align: middle;
      white-space: nowrap;
    }

    .badge.note { color: var(--purple); background: var(--purple-soft); }
    .badge.url { color: var(--green); background: var(--green-soft); }
    .node-content a, .reader-body a { color: var(--accent); }

    .empty {
      padding: 14px 4px;
      color: var(--muted);
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      background: rgb(0 0 0 / 55%);
    }

    .modal-backdrop.open { display: flex; }

    .modal {
      display: flex;
      flex-direction: column;
      width: min(100%, 720px);
      max-height: 92vh;
      overflow: hidden;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 14px;
      box-shadow: var(--shadow);
    }

    .modal-header, .modal-footer {
      padding: 14px 18px;
      border-bottom: 1px solid var(--border);
    }

    .modal-footer {
      justify-content: flex-end;
      border-top: 1px solid var(--border);
      border-bottom: 0;
    }

    .modal-header button {
      width: 34px;
      height: 34px;
      font-size: 20px;
      border: 0;
      background: transparent;
    }

    .modal-body {
      display: grid;
      gap: 12px;
      padding: 18px;
      overflow-y: auto;
    }

    .field { display: grid; gap: 5px; }
    .field label { color: var(--muted); font-size: 12px; font-weight: 650; }

    .primary {
      padding: 9px 16px;
      color: #fff;
      background: var(--accent);
      border-color: var(--accent);
      font-weight: 650;
    }

    .primary:hover { filter: brightness(1.05); }
    .reader-body { padding: 20px; overflow-y: auto; overflow-wrap: anywhere; }
    .reader-body p { margin: 0 0 12px; }
    .reader-body ul, .reader-body ol { margin: 0 0 12px; padding-left: 24px; }
    .reader-body img { max-width: 100%; height: auto; border-radius: 6px; margin: 8px 0; }
    .reader-body blockquote {
      margin: 0 0 12px;
      padding: 6px 12px;
      border-left: 3px solid var(--accent);
      color: var(--muted);
      background: var(--accent-soft);
      border-radius: 4px;
    }

    /* ===== EDITOR ===== */
    .editor-wrap {
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--input);
      overflow: hidden;
    }

    .editor-toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 3px;
      padding: 7px;
      background: var(--bg);
      border-bottom: 1px solid var(--border);
    }

    .editor-toolbar button {
      min-width: 32px;
      height: 32px;
      padding: 0 6px;
      font-size: 14px;
      line-height: 1;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 6px;
      cursor: pointer;
    }

    .editor-toolbar button:hover { background: var(--accent-soft); }
    .editor-toolbar button.active {
      background: var(--accent-soft);
      border-color: var(--accent);
      color: var(--accent);
    }

    .editor-toolbar .sep {
      width: 1px;
      align-self: stretch;
      background: var(--border);
      margin: 0 3px;
    }

    .editor-toolbar select {
      width: auto;
      height: 32px;
      padding: 0 6px;
      font-size: 13px;
      border-radius: 6px;
    }

    .editor-toolbar input[type="color"] {
      width: 34px;
      height: 32px;
      padding: 2px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--panel);
      cursor: pointer;
    }

    .editor-area {
      min-height: 180px;
      max-height: 320px;
      overflow-y: auto;
      padding: 12px 14px;
      outline: none;
      font-size: 15px;
      line-height: 1.6;
    }

    .editor-area:focus { background: var(--input); }

    .editor-area:empty::before {
      content: attr(data-placeholder);
      color: var(--muted);
      pointer-events: none;
    }

    .editor-area img {
      max-width: 100%;
      height: auto;
      border-radius: 6px;
      margin: 6px 0;
    }

    .editor-area blockquote {
      margin: 8px 0;
      padding: 6px 12px;
      border-left: 3px solid var(--accent);
      color: var(--muted);
      background: var(--accent-soft);
      border-radius: 4px;
    }

    .editor-area ul, .editor-area ol { padding-left: 24px; margin: 6px 0; }

    .editor-source {
      width: 100%;
      min-height: 180px;
      padding: 12px 14px;
      font-family: ui-monospace, "Cascadia Code", Consolas, monospace;
      font-size: 13px;
      border: 0;
      border-radius: 0;
      resize: vertical;
      background: var(--input);
      color: var(--text);
    }

    .editor-source:focus { box-shadow: none; }

    .source-toggle {
      font-size: 12px;
      color: var(--muted);
      margin-top: 4px;
      display: flex;
      gap: 6px;
      align-items: center;
    }

    .source-toggle button {
      padding: 3px 8px;
      font-size: 12px;
    }

    @media (max-width: 560px) {
      body { padding: 10px; }
      .app { padding: 15px; }
      .parent-row { grid-template-columns: 1fr; gap: 5px; }
      .node-row { flex-wrap: wrap; }
      .node-content { flex-basis: calc(100% - 35px); }
      .node-actions { width: 100%; padding-left: 31px; }
      .modal { width: 100%; }
      .editor-toolbar button { min-width: 28px; height: 28px; font-size: 12px; }
      .editor-toolbar select { height: 28px; font-size: 12px; }
    }
    a.nt-file { display: inline-block; padding: 1px 9px; border-radius: 999px; border: 1px solid var(--border); background: var(--accent-soft); color: var(--accent); text-decoration: none; cursor: pointer; font-size: .95em; }
    a.nt-file:hover { border-color: var(--accent); }
    .link-row { display: flex; gap: 6px; flex: 1 0 100%; padding-bottom: 6px; margin-bottom: 2px; border-bottom: 1px dashed var(--border); }
    .editor-toolbar .link-row button { flex: 1; height: 36px; font-size: 13px; font-weight: 600; color: var(--accent); background: var(--accent-soft); border-color: var(--accent); }
    .backlinks { margin-top: 18px; padding-top: 10px; border-top: 1px solid var(--border); display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: .92em; }
    .backlinks strong { width: 100%; color: var(--muted); font-weight: 600; }
    #toast { position: fixed; left: 50%; bottom: 18px; transform: translate(-50%, 20px); opacity: 0; pointer-events: none; background: var(--text); color: var(--bg); padding: 10px 16px; border-radius: 10px; box-shadow: var(--shadow); max-width: min(92vw, 520px); z-index: 100000; transition: .2s; font-size: 14px; }
    #toast.show { opacity: 1; transform: translate(-50%, 0); }
    @media (pointer: coarse) {
      .editor-toolbar button, .editor-toolbar select { min-width: 38px; height: 38px; }
      .editor-toolbar .link-row button { height: 42px; font-size: 14px; }
    }
  </style>
</head>

  <script>
    'use strict';

    const STORAGE_KEY = 'note-tree-app-v12';
    const THEME_KEY = 'note-tree-theme';

    let nodes = [];
    let nextId = 1;
    let editingId = null;
    let editingType = 'voce';
    let sourceMode = false;

    const $ = id => document.getElementById(id);
    const tree = $('tree');
    const addParent = $('addParent');
    const searchInput = $('searchInput');
    const editBackdrop = $('editBackdrop');
    const editorArea = $('editorArea');
    const editorSource = $('editorSource');

    // ---------- UTILITY ----------
    function escapeHtml(str) {
      return String(str ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function validUrl(value) {
      try {
        const url = new URL(String(value));
        return url.protocol === 'http:' || url.protocol === 'https:';
      } catch {
        return false;
      }
    }

    function allNodes(list = nodes, result = []) {
      for (const node of list) {
        result.push(node);
        allNodes(node.children || [], result);
      }
      return result;
    }

    function findNode(id, list = nodes) {
      for (const node of list) {
        if (node.id === Number(id)) return node;
        const found = findNode(id, node.children || []);
        if (found) return found;
      }
      return null;
    }

    function findParentList(id, list = nodes) {
      for (const node of list) {
        if ((node.children || []).some(child => child.id === Number(id))) {
          return node.children;
        }
        const found = findParentList(id, node.children || []);
        if (found) return found;
      }
      return null;
    }

    function isDescendant(nodeId, possibleDescendantId) {
      const node = findNode(nodeId);
      if (!node) return false;
      return allNodes(node.children || []).some(item => item.id === Number(possibleDescendantId));
    }

    function countTree(list = nodes) {
      return list.reduce((total, node) => total + 1 + countTree(node.children || []), 0);
    }

    function save() {
      const json = JSON.stringify({ nodes, nextId, savedAt: Date.now() });
      let ok = true;
      try {
        localStorage.setItem(STORAGE_KEY, json);
      } catch (error) {
        ok = false;
        console.error(error);
      }
      // copia di sicurezza in IndexedDB: più spazio, sopravvive a un localStorage pieno o svuotato
      ntPut('state', json).catch(err => {
        console.error(err);
        if (!ok) toast('Impossibile salvare i dati in questo browser: esporta subito un backup JSON.');
      });
      if (!ok) toast('Spazio del browser quasi pieno: i dati sono nella copia di sicurezza. Esporta un backup JSON.');
    }

    // Sanitizza HTML: rimuove script/style/iframe/on* e attributi pericolosi
    function sanitizeHTML(html) {
      const doc = new DOMParser().parseFromString(String(html || ''), 'text/html');
      doc.querySelectorAll('script,style,iframe,object,embed,link,meta').forEach(el => el.remove());

      const walk = (el) => {
        for (const attr of [...el.attributes]) {
          const name = attr.name.toLowerCase();
          if (name.startsWith('on')) el.removeAttribute(attr.name);
          if ((name === 'href' || name === 'src') && /^\s*javascript:/i.test(attr.value)) {
            el.removeAttribute(attr.name);
          }
        }
        for (const child of el.children) walk(child);
      };
      walk(doc.body);
      return doc.body.innerHTML;
    }

    function normalizeNode(raw, id) {
      const type = ['voce', 'nota', 'url', 'cartella'].includes(raw?.type) ? raw.type : 'voce';
      const url = type === 'url' && validUrl(raw?.url) ? String(raw.url).trim() : null;

      return {
        id,
        type: type === 'url' && !url ? 'voce' : type,
        title: String(raw?.title ?? '').trim(),
        body: sanitizeHTML(raw?.body ?? ''),
        url,
        collapsed: Boolean(raw?.collapsed ?? raw?._collapsed),
        children: []
      };
    }

    function load(rawOverride) {
      try {
        const raw = rawOverride || localStorage.getItem(STORAGE_KEY);
        if (!raw) return;

        const data = JSON.parse(raw);
        if (!Array.isArray(data.nodes)) return;

        let maxId = 0;

        function convert(list) {
          return list.map(rawNode => {
            const id = Number.isSafeInteger(Number(rawNode.id)) && Number(rawNode.id) > 0
              ? Number(rawNode.id)
              : maxId + 1;

            maxId = Math.max(maxId, id);
            const node = normalizeNode(rawNode, id);
            node.children = convert(Array.isArray(rawNode.children) ? rawNode.children : []);
            return node;
          });
        }

        nodes = convert(data.nodes);
        nextId = Math.max(Number(data.nextId) || 1, maxId + 1);
      } catch (error) {
        console.warn('Non è stato possibile caricare i dati salvati.', error);
        nodes = [];
        nextId = 1;
      }
    }

    // ---------- LINK INTERNI [[...]] + URL ----------
    // Processa i text node all'interno di un contenitore
    function linkifyTextNode(textNode) {
      const text = textNode.nodeValue;
      if (!text) return;
      // Supporta la sintassi nuova ((Titolo)) e quella storica [[Titolo]].
      const regex = /(https?:\/\/[^\s<]+)|\(\(([^)]+)\)\)|\[\[([^\]]+)\]\]/g;
      let last = 0;
      let match;
      const frag = document.createDocumentFragment();
      let changed = false;

      while ((match = regex.exec(text)) !== null) {
        changed = true;
        if (match.index > last) frag.appendChild(document.createTextNode(text.slice(last, match.index)));
        if (match[1] && validUrl(match[1])) {
          const a = document.createElement('a');
          a.href = match[1];
          a.target = '_blank';
          a.rel = 'noopener noreferrer';
          a.textContent = match[1];
          frag.appendChild(a);
        } else {
          const title = (match[2] || match[3] || '').trim();
          if (!title) {
            frag.appendChild(document.createTextNode(match[0]));
          } else {
            const target = allNodes().find(n => n.title.toLowerCase() === title.toLowerCase() && n.type !== 'url');
            const a = document.createElement('a');
            a.href = '#';
            a.textContent = title;
            if (target) {
              a.addEventListener('click', ev => { ev.preventDefault(); revealNode(target.id); openReader(target.id); });
            } else {
              a.addEventListener('click', ev => {
                ev.preventDefault();
                if (confirm(`La nota "${title}" non esiste. Vuoi crearla alla radice?`)) {
                  createNode({ type: 'nota', title, body: '', url: null, parentId: '' });
                }
              });
              a.style.color = 'var(--danger)';
              a.title = 'Nota non ancora creata';
            }
            frag.appendChild(a);
          }
        }
        last = regex.lastIndex;
      }
      if (!changed) return;
      if (last < text.length) frag.appendChild(document.createTextNode(text.slice(last)));
      textNode.parentNode.replaceChild(frag, textNode);
    }

    function linkifyContainer(container) {
      const walker = document.createTreeWalker(container, NodeFilter.SHOW_TEXT, {
        acceptNode: (n) => {
          if (n.parentElement && ['A', 'SCRIPT', 'STYLE'].includes(n.parentElement.tagName)) {
            return NodeFilter.FILTER_REJECT;
          }
          return NodeFilter.FILTER_ACCEPT;
        }
      });
      const textNodes = [];
      while (walker.nextNode()) textNodes.push(walker.currentNode);
      textNodes.forEach(linkifyTextNode);
    }

    // Renderizza HTML sicuro + link
    function renderRichHTML(html, parent) {
      const clean = sanitizeHTML(html);
      const wrapper = document.createElement('div');
      wrapper.innerHTML = clean;
      linkifyContainer(wrapper);
      while (wrapper.firstChild) parent.appendChild(wrapper.firstChild);
    }

    function nodeMatches(node, query) {
      if (!query) return true;
      const plain = (() => {
        const d = document.createElement('div');
        d.innerHTML = node.body || '';
        return d.textContent || '';
      })();
      return [node.title, plain, node.url].some(value =>
        String(value || '').toLowerCase().includes(query)
      ) || (node.children || []).some(child => nodeMatches(child, query));
    }

    function addOptions(select, excludeId = null) {
      select.replaceChildren();
      const rootOption = document.createElement('option');
      rootOption.value = '';
      rootOption.textContent = 'Radice';
      select.appendChild(rootOption);

      function walk(list, depth) {
        for (const node of list) {
          if (node.id !== excludeId && !isDescendant(excludeId, node.id)) {
            const option = document.createElement('option');
            option.value = String(node.id);
            option.textContent = `${'　'.repeat(depth)}${node.title || node.url || '(senza titolo)'}`;
            select.appendChild(option);
          }
          walk(node.children || [], depth + 1);
        }
      }

      walk(nodes, 0);
    }

    // ---------- RENDER TREE ----------
    function render() {
      const query = searchInput.value.trim().toLowerCase();
      tree.replaceChildren();

      function buildList(list) {
        const ul = document.createElement('ul');

        for (const node of list) {
          if (!nodeMatches(node, query)) continue;

          const li = document.createElement('li');
          li.className = 'node';
          li.dataset.id = String(node.id);
          if (node.collapsed && !query) li.classList.add('collapsed');

          const row = document.createElement('div');
          row.className = 'node-row';

          const toggle = document.createElement('button');
          toggle.type = 'button';
          toggle.className = 'toggle' + (node.children.length ? '' : ' empty');
          toggle.textContent = '▾';
          toggle.title = node.collapsed ? 'Espandi' : 'Comprimi';
          toggle.addEventListener('click', () => {
            node.collapsed = !node.collapsed;
            save();
            render();
          });
          row.appendChild(toggle);

          const content = document.createElement('div');
          content.className = 'node-content';

          if (node.type === 'url' && node.url) {
            const link = document.createElement('a');
            link.href = node.url;
            link.target = '_blank';
            link.rel = 'noopener noreferrer';
            link.textContent = node.title || node.url;
            content.appendChild(link);

            const badge = document.createElement('span');
            badge.className = 'badge url';
            badge.textContent = 'URL';
            content.appendChild(badge);
          } else {
            if (node.type === 'nota' || node.type === 'cartella') {
              const badge = document.createElement('span');
              badge.className = node.type === 'cartella' ? 'badge folder' : 'badge note';
              badge.textContent = node.type === 'cartella' ? '📁 cartella' : 'nota';
              content.appendChild(badge);
              content.appendChild(document.createTextNode(' '));
            }
            const span = document.createElement('span');
            span.textContent = node.title;
            linkifyContainer(span);
            content.appendChild(span);
          }

          row.appendChild(content);

          const actions = document.createElement('div');
          actions.className = 'node-actions';

          const read = document.createElement('button');
          read.type = 'button';
          read.className = 'read';
          read.textContent = '👁';
          read.title = 'Leggi';
          read.setAttribute('aria-label', 'Leggi');
          read.addEventListener('click', () => openReader(node.id));

          const edit = document.createElement('button');
          edit.type = 'button';
          edit.className = 'edit';
          edit.textContent = '✎';
          edit.title = 'Modifica o sposta';
          edit.setAttribute('aria-label', 'Modifica o sposta');
          edit.addEventListener('click', () => openEditor(node.id));

          const del = document.createElement('button');
          del.type = 'button';
          del.className = 'delete';
          del.textContent = '⌫';
          del.title = 'Elimina';
          del.setAttribute('aria-label', 'Elimina');
          del.addEventListener('click', () => {
            if (!confirm(`Eliminare "${node.title}" e tutte le sotto-voci?`)) return;
            const parentList = findParentList(node.id) || nodes;
            const index = parentList.findIndex(item => item.id === node.id);
            if (index >= 0) parentList.splice(index, 1);
            save();
            render();
          });

          actions.append(read, edit, del);
          row.appendChild(actions);
          li.appendChild(row);

          const children = buildList(node.children || []);
          if (children.children.length) li.appendChild(children);
          ul.appendChild(li);
        }

        return ul;
      }

      const built = buildList(nodes);
      tree.append(...built.children);

      $('count').textContent = `${countTree()} ${countTree() === 1 ? 'voce' : 'voci'}`;
      $('emptyMessage').hidden = nodes.length > 0;

      addOptions(addParent);
      if (![...addParent.options].some(option => option.value === addParent.dataset.selected)) {
        addParent.value = '';
      } else {
        addParent.value = addParent.dataset.selected || '';
      }

      if (query && !tree.children.length) {
        const message = document.createElement('li');
        message.className = 'empty';
        message.textContent = `Nessun risultato per "${searchInput.value.trim()}".`;
        tree.appendChild(message);
      }
    }

    // ---------- CRUD ----------
    function createNode(data) {
      const node = {
        id: nextId++,
        type: data.type,
        title: data.title.trim(),
        body: sanitizeHTML(data.body || ''),
        url: data.url || null,
        collapsed: false,
        children: []
      };

      const parentId = Number(data.parentId);
      const parent = parentId ? findNode(parentId) : null;

      if (parent) parent.children.push(node);
      else nodes.push(node);

      save();
      render();
    }

    // ---------- EDITOR ----------
    function setEditorHTML(html) {
      editorArea.innerHTML = html || '';
      if (!editorArea.innerHTML) editorArea.innerHTML = '';
    }

    function getEditorHTML() {
      if (sourceMode) return editorSource.value;
      return editorArea.innerHTML;
    }

    function openEditor(id = null, type = 'voce') {
      editingId = id;
      const node = id ? findNode(id) : null;
      editingType = node ? node.type : type;

      $('editHeading').textContent = node ? 'Modifica voce' : ({
        voce: 'Nuova voce',
        nota: 'Nuova nota interna',
        cartella: 'Nuova cartella',
        url: 'Nuovo link esterno'
      }[editingType] || 'Nuova voce');

      $('itemTitle').value = node?.title || '';
      $('itemUrl').value = node?.url || '';

      setEditorHTML(node?.body || '');
      editorSource.value = node?.body || '';
      sourceMode = false;
      editorArea.hidden = false;
      editorSource.hidden = true;
      $('toggleSource').textContent = 'Mostra HTML';

      $('urlField').hidden = editingType !== 'url';
      $('bodyField').hidden = editingType === 'url' || editingType === 'cartella';
      $('moveField').hidden = !node;

      addOptions($('editParent'), id);
      if (node) {
        function findParentId(list, parentId = null) {
          for (const item of list) {
            if (item.id === node.id) return parentId;
            const result = findParentId(item.children || [], item.id);
            if (result !== undefined) return result;
          }
          return undefined;
        }
        const parentId = findParentId(nodes);
        $('editParent').value = parentId ? String(parentId) : '';
      }

      editorDirty = false;
      editBackdrop.classList.add('open');
      requestAnimationFrame(() => { const titleInput = $('itemTitle'); titleInput.focus({ preventScroll: true }); titleInput.select(); });
    }

    function saveEditor() {
      const title = $('itemTitle').value.trim();
      const url = $('itemUrl').value.trim();
      const body = editingType === 'cartella' ? '' : sanitizeHTML(getEditorHTML());

      if (editingType !== 'url' && !title) {
        alert('Inserisci un titolo per la voce, la nota o la cartella.');
        $('itemTitle').focus();
        return;
      }

      if (editingType === 'url' && !validUrl(url)) {
        alert('Inserisci un URL valido che inizi con http:// o https://.');
        $('itemUrl').focus();
        return;
      }

      if (!editingId) {
        createNode({
          type: editingType,
          title: editingType === 'url' ? (title || url) : title,
          body: editingType === 'url' ? '' : body,
          url: editingType === 'url' ? url : null,
          parentId: addParent.value
        });
      } else {
        const node = findNode(editingId);
        if (!node) return;

        node.title = editingType === 'url' ? (title || url) : title;
        node.body = editingType === 'url' ? '' : body;
        node.url = editingType === 'url' ? url : null;

        const newParentId = Number($('editParent').value) || null;
        const oldList = findParentList(node.id) || nodes;
        const oldIndex = oldList.findIndex(item => item.id === node.id);
        if (oldIndex >= 0) oldList.splice(oldIndex, 1);

        const newParent = newParentId ? findNode(newParentId) : null;
        if (newParent) newParent.children.push(node);
        else nodes.push(node);

        save();
        render();
      }

      editBackdrop.classList.remove('open');
      editingId = null;
    }

    // ---------- READER ----------
    function openReader(id) {
      const node = findNode(id);
      if (!node) return;

      $('readerHeading').textContent = node.title || 'Lettura';
      const body = $('readerBody');
      body.replaceChildren();

      if (node.type === 'url' && node.url) {
        const link = document.createElement('a');
        link.href = node.url;
        link.target = '_blank';
        link.rel = 'noopener noreferrer';
        link.textContent = node.url;
        body.appendChild(link);
      }

      if (node.body) {
        renderRichHTML(node.body, body);
      }

      if (!node.body && !(node.type === 'url' && node.url)) {
        const p = document.createElement('p');
        p.textContent = node.title;
        linkifyContainer(p);
        body.appendChild(p);
      }

      const back = backlinksOf(node);
      if (back.length) {
        const box = document.createElement('div');
        box.className = 'backlinks';
        const h = document.createElement('strong');
        h.textContent = 'Collegato da';
        box.appendChild(h);
        back.forEach(n => {
          const a = document.createElement('a');
          a.href = '#';
          a.textContent = n.title || '(senza titolo)';
          a.addEventListener('click', ev => { ev.preventDefault(); openReader(n.id); });
          box.appendChild(a);
        });
        body.appendChild(box);
      }

      $('readerBackdrop').classList.add('open');
    }

    function revealNode(id) {
      let current = findNode(id);
      while (current) {
        current.collapsed = false;
        const parentList = findParentList(current.id);
        current = parentList
          ? allNodes().find(candidate => candidate.children === parentList) || null
          : null;
      }

      searchInput.value = '';
      render();

      requestAnimationFrame(() => {
        const element = tree.querySelector(`[data-id="${Number(id)}"]`);
        if (element) {
          element.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }
      });
    }

    // ---------- EXPORT / IMPORT ----------
    function download(content, filename, type) {
      // Su APK (Capacitor) salva in cache e apre la condivisione; altrove download classico
      const FS = ntCap('Filesystem'), SH = ntCap('Share');
      if (FS && SH) {
        (async () => {
          try {
            const f = await FS.writeFile({ path: filename, data: content, directory: 'CACHE', encoding: 'utf8' });
            await SH.share({ title: filename, url: f.uri, dialogTitle: 'Salva o condividi' });
          } catch (err) { console.error('export nativo:', err); }
        })();
        return;
      }
      const blob = new Blob([content], { type });
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.href = url;
      link.download = filename;
      link.click();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    }

    function exportJson() {
      download(
        JSON.stringify({ version: 12, exportedAt: new Date().toISOString(), nodes, nextId }, null, 2),
        'note-tree-backup.json',
        'application/json'
      );
    }

    function exportMarkdown() {
      let output = '# Note Tree\n\n';

      function walk(list, depth) {
        for (const node of list) {
          const prefix = '  '.repeat(depth) + '- ';
          const title = node.type === 'url' && node.url
            ? `[${node.title || node.url}](${node.url})`
            : node.title;

          output += `${prefix}${title}\n`;
          if (node.body) {
            const temp = document.createElement('div');
            temp.innerHTML = node.body;
            const plain = temp.textContent || '';
            output += `${'  '.repeat(depth + 1)}${plain.replace(/\n/g, '\n' + '  '.repeat(depth + 1))}\n`;
          }
          walk(node.children || [], depth + 1);
        }
      }

      walk(nodes, 0);
      download(output, 'note-tree.md', 'text/markdown;charset=utf-8');
    }

    function importData(file) {
      if (!file) return;

      const reader = new FileReader();
      reader.onload = () => {
        try {
          const data = JSON.parse(reader.result);
          if (!data || !Array.isArray(data.nodes)) {
            throw new Error('Il file non contiene un elenco valido di voci.');
          }

          if (!confirm(`Importare ${data.nodes.length} voci alla radice? Le voci attuali verranno mantenute.`)) {
            return;
          }

          function remap(list) {
            return list.map(raw => {
              const node = normalizeNode(raw, nextId++);
              node.children = remap(Array.isArray(raw.children) ? raw.children : []);
              return node;
            });
          }

          nodes.push(...remap(data.nodes));
          save();
          render();
        } catch (error) {
          alert(`Importazione non riuscita: ${error.message}`);
        }
      };
      reader.readAsText(file);
    }

    // ---------- THEME ----------
    function setTheme(theme) {
      document.documentElement.dataset.theme = theme;
      $('themeButton').textContent = theme === 'dark' ? '☀️' : '🌙';
      try { localStorage.setItem(THEME_KEY, theme); } catch {}
    }

    // ---------- EDITOR TOOLBAR ----------
    function exec(command, value = null) {
      if (sourceMode) return;
      editorArea.focus();
      document.execCommand(command, false, value);
      updateToolbarState();
    }

    function updateToolbarState() {
      if (sourceMode) return;
      document.querySelectorAll('#editorToolbar button[data-command]').forEach(btn => {
        const cmd = btn.dataset.command;
        try {
          btn.classList.toggle('active', document.queryCommandState(cmd));

      });

    }

    $('editorToolbar').addEventListener('mousedown', (e) => {
      // evita di perdere il focus sull'area editabile
      if (e.target.closest('button')) e.preventDefault();
    });

    $('editorToolbar').addEventListener('click', (e) => {
      const btn = e.target.closest('button[data-command]');
      if (!btn) return;
      e.preventDefault();
      exec(btn.dataset.command, btn.dataset.value || null);
    });

    });

    });

    $('hiliteBtn').addEventListener('click', () => {
      exec('hiliteColor', '#ffff00');
    });

    // ---------- DIALOGO DI TESTO ----------
    // prompt() non esiste in Electron (app Windows): li' si usa una finestra interna.
    function electronPrompt(message, def) {
      return new Promise(resolve => {
        const wrap = document.createElement('div');
        wrap.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:99999;padding:16px';
        const box = document.createElement('div');
        box.style.cssText = 'background:var(--panel);color:var(--text);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow);padding:18px;width:min(100%,420px);display:grid;gap:12px';
        const label = document.createElement('label'); label.textContent = message;
        const input = document.createElement('input'); input.value = def || '';
        input.style.cssText = 'width:100%;padding:9px 10px;border:1px solid var(--border);border-radius:8px;background:var(--input);color:var(--text)';
        const row = document.createElement('div'); row.style.cssText = 'display:flex;gap:8px;justify-content:flex-end';
        const mk = (txt, primary) => {
          const b = document.createElement('button'); b.type = 'button'; b.textContent = txt;
          b.style.cssText = 'padding:8px 14px;border-radius:8px;cursor:pointer;border:1px solid ' + (primary ? 'var(--accent);background:var(--accent);color:#fff' : 'var(--border);background:transparent');
          return b;
        };
        const ok = mk('OK', true), no = mk('Annulla', false);
        const done = v => { wrap.remove(); resolve(v); };
        ok.onclick = () => done(input.value); no.onclick = () => done(null);
        wrap.addEventListener('mousedown', e => { if (e.target === wrap) done(null); });
        input.addEventListener('keydown', e => {
          if (e.key === 'Enter') { e.preventDefault(); e.stopPropagation(); done(input.value); }
          else if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); done(null); }
        });
        row.append(no, ok); box.append(label, input, row); wrap.append(box); document.body.append(wrap);
        input.focus(); input.select();
      });
    }

    async function askText(message, def) {
      const sel = window.getSelection();
      const saved = sel && sel.rangeCount ? sel.getRangeAt(0).cloneRange() : null;
      const answer = /Electron\//.test(navigator.userAgent)
        ? await electronPrompt(message, def)
        : window.prompt(message, def === undefined ? '' : def);
      if (saved) { try { editorArea.focus(); sel.removeAllRanges(); sel.addRange(saved); } catch (e) {} }
      return answer;
    }

    // ---------- PULSANTE [[ ]], COLLEGAMENTI A FILE, DATI ----------
    // Il file non viene mai copiato nell'app: si salva solo un riferimento all'originale.
    //  Windows (app): percorso del file   |  Android (app): indirizzo SAF con permesso persistente
    //  Chrome/Edge su computer: File System Access  |  altri browser: non disponibile
    const NT_MIME = {
      pdf: 'application/pdf', doc: 'application/msword',
      docx: 'application/vnd.openxmlformats-officedocument.wordprocessingml.document',
      xls: 'application/vnd.ms-excel', xlsx: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet',
      ppt: 'application/vnd.ms-powerpoint', pptx: 'application/vnd.openxmlformats-officedocument.presentationml.presentation',
      txt: 'text/plain', csv: 'text/csv', png: 'image/png', jpg: 'image/jpeg', jpeg: 'image/jpeg'
    };
    const ntMime = name => NT_MIME[(String(name).split('.').pop() || '').toLowerCase()] || 'application/octet-stream';
    const ntPlugins = {};
    function ntCap(name) {
      const C = window.Capacitor;
      if (!(C && C.isNativePlatform && C.isNativePlatform())) return null;
      if (!ntPlugins[name]) ntPlugins[name] = (C.Plugins && C.Plugins[name]) || (C.registerPlugin ? C.registerPlugin(name) : null);
      return ntPlugins[name];
    }
    const NT_KIND = (window.desktop && window.desktop.openFile) ? 'path'
      : (ntCap('NtFiles') ? 'android' : (window.showOpenFilePicker ? 'fsa' : ''));

    // piccolo archivio IndexedDB: copia di sicurezza dei dati e riferimenti ai file (mai i file)
    const ntDB = () => new Promise((res, rej) => {
      const r = indexedDB.open('note-tree-files', 1);
      r.onupgradeneeded = () => r.result.createObjectStore('f');
      r.onsuccess = () => res(r.result);
      r.onerror = () => rej(r.error);
    });
    const ntPut = async (key, val) => {
      const db = await ntDB();
      return new Promise((res, rej) => { const t = db.transaction('f', 'readwrite'); t.objectStore('f').put(val, key); t.oncomplete = res; t.onerror = () => rej(t.error); });
    };
    const ntGet = async key => {
      const db = await ntDB();
      return new Promise((res, rej) => { const q = db.transaction('f').objectStore('f').get(key); q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error); });
    };
    const ntDel = async key => {
      const db = await ntDB();
      return new Promise((res, rej) => { const t = db.transaction('f', 'readwrite'); t.objectStore('f').delete(key); t.oncomplete = res; t.onerror = () => rej(t.error); });
    };
    const ntId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);

    function toast(msg, ms = 6000) {
      let t = $('toast');
      if (!t) { t = document.createElement('div'); t.id = 'toast'; t.setAttribute('role', 'status'); document.body.appendChild(t); }
      t.textContent = msg; t.classList.add('show');
      clearTimeout(toast.timer); toast.timer = setTimeout(() => t.classList.remove('show'), ms);
    }

    async function restoreFromMirror() {
      try {
        const mirror = await ntGet('state');
        if (!mirror) return;
        const m = JSON.parse(mirror);
        let ls = null;
        try { ls = JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null'); } catch (e) {}
        const newer = !ls || (m.savedAt || 0) > (ls.savedAt || 0);
        if (newer && Array.isArray(m.nodes) && (m.nodes.length || !ls)) {
          load(mirror); render();
          toast('Dati ripristinati dalla copia di sicurezza.');
        }
      } catch (err) { console.warn(err); }
    }

    let editorDirty = false;
    // Mantiene il campo Titolo utilizzabile anche dopo click rapidi tra controlli della finestra.
    $('itemTitle').addEventListener('pointerdown', () => { $('itemTitle').focus(); });
    ['itemTitle', 'itemUrl', 'editorArea', 'editorSource', 'editParent'].forEach(id => {
      const el = $(id);
      if (el) { el.addEventListener('input', () => { editorDirty = true; }); el.addEventListener('change', () => { editorDirty = true; }); }
    });
    function closeEditor() {
      if (editorDirty && !confirm('Ci sono modifiche non salvate. Chiudere senza salvare?')) return;
      editorDirty = false;
      editBackdrop.classList.remove('open');
    }

    function backlinksOf(node) {
      const t = (node.title || '').trim().toLowerCase();
      if (!t) return [];
      const plain = html => new DOMParser().parseFromString(String(html || ''), 'text/html').body.textContent || '';
      return allNodes().filter(n => {
        if (n.id === node.id) return false;
        const re = /\(\(([^)]+)\)\)|\[\[([^\]]+)\]\]/g;
        const text = (n.title || '') + ' ' + plain(n.body);
        let m;
        while ((m = re.exec(text)) !== null) if ((m[1] || m[2]).trim().toLowerCase() === t) return true;
        return false;
      });
    }

    function ntSaveSel() {
      const sel = window.getSelection();
      const saved = sel && sel.rangeCount ? sel.getRangeAt(0).cloneRange() : null;
      return () => {
        try {
          editorArea.focus();
          if (saved && editorArea.contains(saved.commonAncestorContainer)) { sel.removeAllRanges(); sel.addRange(saved); }
        } catch (e) {}
      };
    }

    // restituisce { kind, ref, name, mime } oppure null
    async function ntPick() {
      if (NT_KIND === 'path') {
        const r = await window.desktop.pickFile();
        return r ? { kind: 'path', ref: r.path, name: r.name, mime: ntMime(r.name) } : null;
      }
      if (NT_KIND === 'android') {
        const r = await ntCap('NtFiles').pick();
        return !r || r.cancelled ? null : { kind: 'android', ref: r.uri, name: r.name, mime: r.mime || ntMime(r.name) };
      }
      if (NT_KIND === 'fsa') {
        const [h] = await window.showOpenFilePicker({ multiple: false });
        const id = ntId();
        await ntPut('h:' + id, h);
        return { kind: 'fsa', ref: id, name: h.name, mime: ntMime(h.name) };
      }
      alert("Il collegamento ai file non è disponibile in questo browser. Usa l'app Android, l'app Windows oppure Chrome/Edge su computer.");
      return null;
    }

    async function ntOpen(d) {
      try {
        if (d.ntKind !== NT_KIND) {
          alert("Questo file è stato collegato da un'altra versione dell'app (browser, telefono o Windows) e qui non è disponibile.");
          return;
        }
        if (NT_KIND === 'path') {
          const err = await window.desktop.openFile(d.ntRef);
          if (err) alert(err);
        } else if (NT_KIND === 'android') {
          await ntCap('NtFiles').open({ uri: d.ntRef, mime: d.ntMime || ntMime(d.ntName || '') });
        } else if (NT_KIND === 'fsa') {
          const h = await ntGet('h:' + d.ntRef);
          if (!h) { alert('Collegamento non trovato: i dati del browser sono stati cancellati. Ricollega il file.'); return; }
          if ((await h.queryPermission({ mode: 'read' })) !== 'granted' && (await h.requestPermission({ mode: 'read' })) !== 'granted') {
            alert('Permesso di lettura negato.'); return;
          }
          const file = await h.getFile();
          const url = URL.createObjectURL(file);
          if (/^(application\/pdf|image\/(png|jpeg|gif|webp)|text\/plain)$/.test(file.type)) {
            window.open(url, '_blank');
          } else {
            const a = document.createElement('a');
            a.href = url; a.download = file.name;
            document.body.appendChild(a); a.click(); a.remove();
          }
          setTimeout(() => URL.revokeObjectURL(url), 60000);
        }
      } catch (err) {
        if (err && err.name === 'NotFoundError') { alert('Il file non esiste più (spostato o eliminato).'); return; }
        console.error(err);
        alert('Impossibile aprire il file: ' + (err && err.message ? err.message : err));
      }
    }

    async function insertFileLink() {
      if (sourceMode) { alert("Torna all'editor per collegare un file."); return; }
      const restore = ntSaveSel();
      try {
        const f = await ntPick();
        if (!f) return;
        restore();
        const html = '<a href="#" class="nt-file" contenteditable="false" data-nt-kind="' + f.kind +
          '" data-nt-ref="' + escapeHtml(f.ref) + '" data-nt-name="' + escapeHtml(f.name) +
          '" data-nt-mime="' + escapeHtml(f.mime) + '">📎 ' + escapeHtml(f.name) + '</a>&nbsp;';
        document.execCommand('insertHTML', false, html);
      } catch (err) {
        if (err && err.name === 'AbortError') return;
        console.error(err);
        alert('Impossibile collegare il file: ' + (err && err.message ? err.message : err));
      }
    }

    // (( )): racchiude il testo selezionato o inserisce le parentesi con il cursore al centro.
    function insertWikiBrackets() {
      if (sourceMode) { alert("Torna all'editor visuale per inserire un collegamento."); return; }
      const restoreSelection = ntSaveSel();
      restoreSelection();
      editorArea.focus();
      const sel = window.getSelection();
      const selectedText = sel ? sel.toString().replace(/\s+/g, ' ').trim().replace(/[()]/g, '') : '';
      if (selectedText) {
        document.execCommand('insertText', false, '((' + selectedText + '))');
      } else {
        document.execCommand('insertText', false, '(())');
        const current = window.getSelection();
        if (current && current.modify) {
          current.modify('move', 'backward', 'character');
          current.modify('move', 'backward', 'character');
        } else if (current && current.rangeCount) {
          const range = current.getRangeAt(0);
          range.setStart(range.startContainer, Math.max(0, range.startOffset - 2));
          range.collapse(true);
          current.removeAllRanges(); current.addRange(range);
        }
      }
      editorDirty = true;
    }

    document.addEventListener('click', e => {
      const a = e.target.closest && e.target.closest('a.nt-file');
      if (!a) return;
      e.preventDefault(); e.stopPropagation();
      ntOpen(a.dataset);
    }, true);
    $('insertWikiBtn').addEventListener('click', insertWikiBrackets);

    // Il pulsante collega nota inserisce (( )) senza finestre o numeri da scegliere.
    $('insertFileBtn').addEventListener('click', insertFileLink);

    $('insertLinkBtn').addEventListener('click', async () => {
      const url = await askText('URL del link (https://...):');
      if (!url) return;
      if (!validUrl(url)) { alert('URL non valido.'); return; }
      const text = await askText('Testo del link (lascia vuoto per usare l\'URL):', '');
      if (text) {
        const html = `<a href="${escapeHtml(url)}" target="_blank" rel="noopener noreferrer">${escapeHtml(text)}</a>`;
        document.execCommand('insertHTML', false, html);
      } else {
        exec('createLink', url);
      }
    });

    $('insertImageUrlBtn').addEventListener('click', async () => {
      const url = await askText('URL immagine (https://...):');
      if (!url) return;
      if (!validUrl(url)) { alert('URL non valido.'); return; }
      exec('insertImage', url);
    });

    $('insertImageFileBtn').addEventListener('click', () => $('imageFile').click());

    $('imageFile').addEventListener('change', (e) => {
      const file = e.target.files && e.target.files[0];
      e.target.value = '';
      if (!file) return;
      if (!file.type.startsWith('image/')) { alert('Seleziona un file immagine.'); return; }
      const reader = new FileReader();
      reader.onload = () => {
        if (sourceMode) return;
        editorArea.focus();
        document.execCommand('insertImage', false, reader.result);
      };
      reader.readAsDataURL(file);
    });

    $('toggleSource').addEventListener('click', () => {
      if (!sourceMode) {
        editorSource.value = editorArea.innerHTML;
        editorArea.hidden = true;
        editorSource.hidden = false;
        sourceMode = true;
        $('toggleSource').textContent = 'Mostra editor';
      } else {
        editorArea.innerHTML = sanitizeHTML(editorSource.value);
        editorSource.hidden = true;
        editorArea.hidden = false;
        sourceMode = false;
        $('toggleSource').textContent = 'Mostra HTML';
      }
    });

    editorArea.addEventListener('keyup', updateToolbarState);
    editorArea.addEventListener('mouseup', updateToolbarState);
    editorArea.addEventListener('focus', updateToolbarState);
    editorArea.addEventListener('input', () => {
      if (editorArea.innerHTML === '<br>') editorArea.innerHTML = '';
    });

    // ---------- EVENTI GLOBALI ----------
    document.querySelectorAll('.add-button').forEach(button => {
      button.addEventListener('click', () => openEditor(null, button.dataset.type));
    });

    $('saveItem').addEventListener('click', saveEditor);
    $('itemUrl').addEventListener('keydown', event => {
      if (event.key === 'Enter') saveEditor();
    });

    document.querySelectorAll('[data-close="edit"]').forEach(button => {
      button.addEventListener('click', () => closeEditor());
    });

    document.querySelectorAll('[data-close="reader"]').forEach(button => {
      button.addEventListener('click', () => $('readerBackdrop').classList.remove('open'));
    });

    editBackdrop.addEventListener('click', event => {
      if (event.target === editBackdrop) closeEditor();
    });

    $('readerBackdrop').addEventListener('click', event => {
      if (event.target === $('readerBackdrop')) $('readerBackdrop').classList.remove('open');
    });

    searchInput.addEventListener('input', render);
    addParent.addEventListener('change', () => {
      addParent.dataset.selected = addParent.value;
    });

    $('themeButton').addEventListener('click', () => {
      setTheme(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark');
    });

    $('exportJson').addEventListener('click', exportJson);
    $('exportMd').addEventListener('click', exportMarkdown);
    $('importButton').addEventListener('click', () => $('importFile').click());
    $('importFile').addEventListener('change', event => {
      importData(event.target.files?.[0]);
      event.target.value = '';
    });

    $('resetButton').addEventListener('click', () => {
      if (!confirm('Vuoi davvero cancellare tutte le voci?')) return;
      nodes = [];
      nextId = 1;
      localStorage.removeItem(STORAGE_KEY);
      ntDel('state').catch(() => {});
      render();
    });

    document.addEventListener('keydown', event => {
      if (event.key === 'Escape') {
        if (editBackdrop.classList.contains('open')) closeEditor();
        $('readerBackdrop').classList.remove('open');
      }
      if ((event.ctrlKey || event.metaKey) && event.key === 'Enter' && editBackdrop.classList.contains('open')) {
        saveEditor();
      }
    });

    // ---------- INIT ----------
    try {
      const savedTheme = localStorage.getItem(THEME_KEY);
      const preferredTheme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      setTheme(savedTheme || preferredTheme);
    } catch {
      setTheme('light');
    }

    load();
    render();
    restoreFromMirror();
    if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
  </script>
</body>
</html>
